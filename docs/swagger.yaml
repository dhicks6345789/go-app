basePath: /api/v1
definitions:
  auth.UserInfo:
    properties:
      auth_type:
        type: string
      mode:
        type: string
      username:
        type: string
    type: object
  handlers.CreateItemRequest:
    properties:
      name:
        example: Sample Item
        type: string
    type: object
  handlers.Item:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API documentation for the self-contained Go application framework.
  title: Go Self-Contained App API
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      description: Returns operational status of the service.
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health Check
      tags:
      - system
  /api/v1/info:
    get:
      description: Returns system metrics, Go version, OS/Arch, and uptime.
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: System Info
      tags:
      - system
  /api/v1/items:
    get:
      description: Returns all stored items.
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/handlers.Item'
              type: array
            type: object
      summary: List Items
      tags:
      - items
    post:
      consumes:
      - application/json
      description: Creates a new item.
      parameters:
      - description: Item to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.Item'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create Item
      tags:
      - items
  /api/v1/user:
    get:
      description: Returns authenticated user info based on environment or proxy headers.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserInfo'
      summary: Get Current User
      tags:
      - user
swagger: "2.0"
